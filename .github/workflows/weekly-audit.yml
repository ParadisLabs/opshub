name: Weekly read-only ecosystem audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run read-only audit
        run: node opshub/scripts/weekly-audit.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-${{ github.run_id }}
          path: artifacts/audits/
          retention-days: 90
