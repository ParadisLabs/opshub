name: Debug setWebhook
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: setWebhook
        run: |
          echo "=== setWebhook Response ==="
          RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}\n" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=${{ secrets.HUB_URL }}/telegram" \
            -d "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
            -d "allowed_updates=[\"message\",\"callback_query\"]")
          echo "$RESP"
          echo ""
          echo "=== getWebhookInfo ==="
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo"
          echo ""
          echo "=== getMe (token check) ==="
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe"
          echo ""
      - name: verify via OPSHub
        run: |
          echo "=== verify webhook via OPSHub /tg-webhook-info ==="
          curl -s "https://${{ secrets.HUB_URL }}/tg-webhook-info"
          echo ""
